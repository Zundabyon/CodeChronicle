name: Cloudflare CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:worker
      - run: npm run test:motion
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run build:staging

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a8bbad23e1d4186f48ac55c55dd9501c
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Register CLOUDFLARE_API_TOKEN in repository Actions secrets.'
            exit 1
          fi
      - run: npm ci
      - run: npm run build:staging
      # Publish the immutable catalog before deploying the client that requires it.
      - run: npx wrangler d1 migrations apply codechronicle-staging --remote --config wrangler.staging.jsonc
      - run: npx wrangler d1 execute codechronicle-staging --remote --file seed.game.sql --config wrangler.staging.jsonc
      - run: npx wrangler deploy --config wrangler.staging.jsonc
      - run: npm run check:deployed
